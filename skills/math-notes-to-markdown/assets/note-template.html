<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #5f6570;
    --rule: #e2e5ea;
    --accent: #2f5d8a;
    --tint: #f6f8fa;
    --paper: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #eef0f3;
    color: var(--ink);
    font: 16px/1.65 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  main {
    max-width: 46rem;
    margin: 2rem auto 4rem;
    padding: 3rem 3.25rem 3.5rem;
    background: var(--paper);
    box-shadow: 0 1px 3px rgba(0,0,0,.09), 0 8px 28px rgba(0,0,0,.06);
    border-radius: 3px;
  }
  header.meta { border-bottom: 2px solid var(--ink); padding-bottom: 1rem; margin-bottom: 2rem; }
  header.meta h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 .6rem; letter-spacing: -.01em; }
  header.meta dl {
    display: grid; grid-template-columns: max-content 1fr; gap: .2rem .9rem;
    margin: 0; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    font-size: .8rem; color: var(--muted);
  }
  header.meta dt { font-weight: 600; text-transform: uppercase; letter-spacing: .05em; font-size: .7rem; padding-top: .12rem; }
  header.meta dd { margin: 0; overflow-wrap: anywhere; }
  header.meta a { color: var(--accent); }

  article h2 {
    font-size: 1.35rem; margin: 2.4rem 0 .9rem; padding-bottom: .35rem;
    border-bottom: 1px solid var(--rule);
  }
  article h3 { font-size: 1.1rem; margin: 1.8rem 0 .6rem; color: #2c3340; }
  article h4 { font-size: .95rem; margin: 1.3rem 0 .4rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; }
  article p, article li { orphans: 3; widows: 3; }
  article ul, article ol { padding-left: 1.4rem; }
  article li { margin: .35rem 0; }
  article hr { border: 0; border-top: 1px solid var(--rule); margin: 2.5rem 0; }
  article strong { font-weight: 700; }
  article code { background: var(--tint); padding: .1em .35em; border-radius: 3px; font-size: .88em; }
  article blockquote { margin: 1rem 0; padding: .1rem 1rem; border-left: 3px solid var(--rule); color: var(--muted); }

  table { border-collapse: collapse; width: 100%; margin: 1.2rem 0; font-size: .92rem; }
  th, td { border: 1px solid var(--rule); padding: .5rem .7rem; text-align: left; vertical-align: top; }
  thead th { background: var(--tint); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; }
  .table-wrap { overflow-x: auto; }

  mjx-container[display="true"] { margin: 1.1rem 0 !important; }

  #print {
    position: fixed; top: 1rem; right: 1rem; z-index: 5;
    font: 600 .8rem/1 ui-sans-serif, system-ui, sans-serif;
    padding: .6rem .9rem; border: 1px solid var(--rule); border-radius: 6px;
    background: var(--paper); color: var(--accent); cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
  }
  #print:hover { background: var(--tint); }

  @media (max-width: 640px) {
    main { margin: 0; padding: 1.75rem 1.25rem 2.5rem; border-radius: 0; }
  }
  @media print {
    body { background: #fff; font-size: 11.5pt; }
    main { max-width: none; margin: 0; padding: 0; box-shadow: none; }
    #print { display: none; }
    article h2, article h3, article h4 { break-after: avoid; page-break-after: avoid; }
    table, mjx-container, li { break-inside: avoid; page-break-inside: avoid; }
    a { color: inherit; text-decoration: none; }
    @page { margin: 18mm 16mm; }
  }
</style>
</head>
<body>
<button id="print" onclick="window.print()">Print / Save as PDF</button>
<main>
  <header class="meta" id="meta"></header>
  <article id="content"></article>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
<script>
(function () {
  var PAYLOAD = "__PAYLOAD__";

  function decode(b64) {
    var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
    return JSON.parse(new TextDecoder("utf-8").decode(bytes));
  }

  // Math was pulled out before Markdown parsing so that underscores and asterisks
  // inside equations survive. Escape it on the way back in: notes are full of
  // things like $a < 0$, which the HTML parser would otherwise eat as a tag.
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  var data = decode(PAYLOAD);
  var meta = data.meta || {};

  if (meta.title) { document.title = meta.title; }

  var rows = [
    ["Course", meta.course],
    ["Module", meta.module],
    ["Pages", meta.pages],
    ["Topics", (meta.topics || []).join(" · ")],
    ["Added", meta.created]
  ].filter(function (r) { return r[1]; });

  var metaHtml = "<h1>" + escapeHtml(meta.title || "Notes") + "</h1>";
  if (rows.length || meta.source) {
    metaHtml += "<dl>";
    rows.forEach(function (r) {
      metaHtml += "<dt>" + r[0] + "</dt><dd>" + escapeHtml(String(r[1])) + "</dd>";
    });
    if (meta.source) {
      var u = escapeHtml(meta.source);
      metaHtml += '<dt>Source</dt><dd><a href="' + u + '" rel="noopener noreferrer">' + u + "</a></dd>";
    }
    metaHtml += "</dl>";
  }
  document.getElementById("meta").innerHTML = metaHtml;

  marked.setOptions({ gfm: true, breaks: false });
  var html = marked.parse(data.md || "");
  html = html.replace(/MATHPLACEHOLDER(\d+)ENDMATH/g, function (_, i) {
    return escapeHtml(data.math[Number(i)] || "");
  });

  var article = document.getElementById("content");
  article.innerHTML = html;

  // let wide tables scroll instead of blowing out the page width
  Array.prototype.forEach.call(article.querySelectorAll("table"), function (t) {
    var wrap = document.createElement("div");
    wrap.className = "table-wrap";
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });

  // MathJax loads async, so it may arrive before or after this content lands
  function typeset() {
    if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
      MathJax.startup.promise.then(function () { MathJax.typesetPromise([article]); });
    }
  }
  if (window.MathJax && MathJax.startup) {
    typeset();
  } else {
    var tag = document.getElementById("MathJax-script");
    tag.addEventListener("load", typeset);
    tag.addEventListener("error", function () {
      var n = document.createElement("p");
      n.style.cssText = "color:#8a5a2f;font-family:system-ui,sans-serif;font-size:.85rem";
      n.textContent = "Equations need an internet connection to render. The .md file has the full LaTeX either way.";
      article.parentNode.insertBefore(n, article);
    });
  }
})();
</script>
</body>
</html>
